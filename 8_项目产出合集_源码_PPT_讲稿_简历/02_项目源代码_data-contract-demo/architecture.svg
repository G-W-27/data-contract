<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a0aec0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="800" fill="#ffffff"/>

  <!-- Header -->
  <text x="20" y="32" font-size="18" font-weight="700" fill="#102a43">ERP Data Contract · 第七卷架构图（落地 / 规划边界）</text>
  <text x="20" y="52" font-size="12" fill="#52606d">实线框 = 本轮已落地（A 人工门禁 · B Git环 · C 审计 · D 失败解释 · E 修复单 · F 告警去重 · ⑨ Evals · H CI）；虚线框 = 规划 / 下一轮（③ ④ ⑤）</text>

  <!-- Column titles -->
  <text x="40" y="80" font-size="14" font-weight="700" fill="#334e68">数据面 · 检查与失败闭环</text>
  <text x="520" y="80" font-size="14" font-weight="700" fill="#1b7f5e">LLM Contract Copilot（Day 2）</text>

  <!-- ===== A column : data plane ===== -->
  <g>
    <rect x="40" y="96" width="440" height="72" rx="8" fill="#e8eef6" stroke="#334e68" stroke-width="1.5"/>
    <text x="52" y="118" font-size="13" font-weight="600" fill="#102a43">业务数据产生</text>
    <text x="52" y="138" font-size="11" fill="#334e68">业务操作 → journal_entries（源表, Postgres, 12字段DB check）</text>
    <text x="52" y="156" font-size="11" fill="#334e68">→ erp_transactions 视图（Data Contract 投影）</text>

    <rect x="40" y="180" width="440" height="58" rx="8" fill="#e8eef6" stroke="#334e68" stroke-width="1.5"/>
    <text x="52" y="202" font-size="13" font-weight="600" fill="#102a43">datacontract-cli 检查</text>
    <text x="52" y="222" font-size="11" fill="#334e68">72 checks + custom_sql → check_results（含 FAIL）</text>

    <rect x="40" y="250" width="440" height="58" rx="8" fill="#e8eef6" stroke="#334e68" stroke-width="1.5"/>
    <text x="52" y="272" font-size="13" font-weight="600" fill="#102a43">⑦ Failure Explanation（D）</text>
    <text x="52" y="292" font-size="11" fill="#334e68">确定性聚类 + 一类一次缓存（LLM 只描述类别）</text>

    <rect x="40" y="320" width="440" height="58" rx="8" fill="#e8eef6" stroke="#334e68" stroke-width="1.5"/>
    <text x="52" y="342" font-size="13" font-weight="600" fill="#102a43">Day5 结构化修复单（E）</text>
    <text x="52" y="362" font-size="11" fill="#334e68">SQL 定位 + 固定模板（LLM 不参与）</text>

    <rect x="40" y="390" width="440" height="58" rx="8" fill="#e8eef6" stroke="#334e68" stroke-width="1.5"/>
    <text x="52" y="412" font-size="13" font-weight="600" fill="#102a43">Day5 告警去重（F）</text>
    <text x="52" y="432" font-size="11" fill="#334e68">进程内 Set/TTL，窗口内只发一次</text>
  </g>

  <!-- ===== B column : LLM Copilot ===== -->
  <g>
    <rect x="520" y="96" width="420" height="42" rx="8" fill="#eafaf1" stroke="#1b7f5e" stroke-width="1.5"/>
    <text x="532" y="122" font-size="12" font-weight="600" fill="#0b3d2e">自然语言需求（人话）</text>

    <rect x="520" y="150" width="420" height="42" rx="8" fill="#eafaf1" stroke="#1b7f5e" stroke-width="1.5"/>
    <text x="532" y="176" font-size="12" font-weight="600" fill="#0b3d2e">LLM → JSON（Schema 入口）</text>

    <rect x="520" y="204" width="420" height="42" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
    <text x="532" y="230" font-size="12" font-weight="600" fill="#7a3e00">G1 结构闸：Schema 校验</text>

    <rect x="520" y="258" width="420" height="42" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
    <text x="532" y="284" font-size="12" font-weight="600" fill="#7a3e00">G2 字段白名单闸</text>

    <rect x="520" y="312" width="420" height="74" rx="8" fill="#eafaf1" stroke="#1b7f5e" stroke-width="1.5"/>
    <text x="532" y="334" font-size="12" font-weight="600" fill="#0b3d2e">rule_id 内容寻址（copilot_ + sha256[:12]）</text>
    <text x="532" y="354" font-size="11" fill="#0b3d2e">→ YAML diff → candidate</text>
    <text x="532" y="372" font-size="11" fill="#0b3d2e">（绝不覆盖生产 YAML）</text>

    <rect x="520" y="398" width="420" height="54" rx="8" fill="#eafaf1" stroke="#1b7f5e" stroke-width="1.5"/>
    <text x="532" y="420" font-size="12" font-weight="600" fill="#0b3d2e">四护栏</text>
    <text x="532" y="440" font-size="11" fill="#0b3d2e">不直写 / 不直执行 / 必过Schema / 版本可追溯</text>
  </g>

  <!-- C cross-cutting band -->
  <rect x="40" y="464" width="900" height="46" rx="8" fill="#eef2ff" stroke="#3b4cca" stroke-width="1.5"/>
  <text x="52" y="492" font-size="12" font-weight="600" fill="#1a237e">C 跨切面：LLM 审计日志（8字段 + PII 脱敏）覆盖每次 Copilot 调用</text>

  <!-- Governance container -->
  <rect x="40" y="536" width="900" height="86" rx="8" fill="#f0f4f8" stroke="#334e68" stroke-width="1.5"/>
  <text x="52" y="558" font-size="13" font-weight="700" fill="#102a43">Day 1 变更治理（A 人工门禁 / B Git 环）</text>
  <g>
    <rect x="52" y="566" width="280" height="46" rx="6" fill="#ffffff" stroke="#334e68"/>
    <text x="64" y="588" font-size="12" font-weight="600" fill="#102a43">CCR 变更单</text>
    <text x="64" y="606" font-size="11" fill="#334e68">requested_by≠approved_by，状态机</text>

    <rect x="340" y="566" width="280" height="46" rx="6" fill="#ffffff" stroke="#334e68"/>
    <text x="352" y="588" font-size="12" font-weight="600" fill="#102a43">A 人工门禁</text>
    <text x="352" y="606" font-size="11" fill="#334e68">后端防重复提交</text>

    <rect x="628" y="566" width="304" height="46" rx="6" fill="#ffffff" stroke="#334e68"/>
    <text x="640" y="588" font-size="12" font-weight="600" fill="#102a43">B Git 环</text>
    <text x="640" y="606" font-size="11" fill="#334e68">candidate+diff 提交，git_ref 回填</text>
  </g>

  <!-- Evals band -->
  <rect x="40" y="638" width="900" height="48" rx="8" fill="#eef2ff" stroke="#3b4cca" stroke-width="1.5"/>
  <text x="52" y="666" font-size="12" font-weight="600" fill="#1a237e">⑨ Evals 黄金集 + H CI 门禁：离线回放两道闸 + RULE_ID 复现；CI 退出码 0/1 兜底</text>

  <!-- Planning (dashed) -->
  <rect x="40" y="702" width="900" height="70" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="52" y="722" font-size="12" font-weight="700" fill="#4a5568">规划 / 下一轮（🔵）</text>
  <g>
    <rect x="52" y="732" width="280" height="34" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-dasharray="5 4"/>
    <text x="64" y="754" font-size="11" fill="#4a5568">③ 审批人资格（资质矩阵）</text>

    <rect x="340" y="732" width="280" height="34" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-dasharray="5 4"/>
    <text x="352" y="754" font-size="11" fill="#4a5568">④ 变更影响评估（Spark / ClickHouse）</text>

    <rect x="628" y="732" width="304" height="34" rx="6" fill="#ffffff" stroke="#a0aec0" stroke-dasharray="5 4"/>
    <text x="640" y="754" font-size="11" fill="#4a5568">⑤ 契约版本回退（Nacos / Apollo）</text>
  </g>

  <!-- ===== Connectors ===== -->
  <!-- A vertical chain -->
  <line x1="260" y1="168" x2="260" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="238" x2="260" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="308" x2="260" y2="320" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="378" x2="260" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B vertical chain -->
  <line x1="730" y1="138" x2="730" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="192" x2="730" y2="204" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="246" x2="730" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="300" x2="730" y2="312" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="386" x2="730" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B4 -> C -> Governance -->
  <line x1="730" y1="452" x2="730" y2="464" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="510" x2="730" y2="536" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Governance -> Evals -> Planning -->
  <line x1="490" y1="622" x2="490" y2="638" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="686" x2="490" y2="702" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowD)"/>
</svg>
